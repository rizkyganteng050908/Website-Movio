<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f0f0f">
<title>Movio - Watch Your Favorite Videos</title>

<style>
:root{
  --bg:#0f0f0f;
  --panel:#181818;
  --hover:#272727;
  --border:#3f3f3f;
  --text:#f1f1f1;
  --muted:#aaa;
  --red:#ff0000;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Roboto","Arial",sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
button{cursor:pointer;border:none;background:none;color:inherit}
.hidden{display:none!important}
button:focus-visible,input:focus-visible{outline:2px solid #3ea6ff;outline-offset:2px}

/* BRAND LOGO */
.brand{display:flex;align-items:center;gap:6px;font-size:19px;font-weight:700;letter-spacing:-0.5px;color:white;text-decoration:none;user-select:none}
.logo-icon{display:grid;place-items:center;width:30px;height:22px;border-radius:6px;background:var(--red);color:white;font-size:12px;font-weight:900}

/* LOGIN SCREEN */
.login-screen{
 position:fixed;inset:0;z-index:1000;display:flex;align-items:center;
 justify-content:center;padding:20px;overflow-y:auto;
 background:radial-gradient(circle at center,#1f1f2e 0%,#0f0f0f 100%)
}
.login-box{
 width:100%;max-width:400px;padding:36px 28px;text-align:center;
 border:1px solid rgba(255,255,255,0.1);border-radius:16px;background:#181818;
 box-shadow:0 20px 50px rgba(0,0,0,0.8)
}
.login-box .brand{justify-content:center;font-size:24px;margin-bottom:12px}
.login-box .logo-icon{width:38px;height:26px;font-size:16px}
.login-box h1{margin:12px 0;font-size:22px;font-weight:500}
.login-box p{font-size:13px;line-height:1.6;color:var(--muted);margin-bottom:24px}
.login-btn{
 width:100%;padding:12px;border:1px solid var(--border);
 border-radius:20px;background:#222;color:white;font-weight:500;
 display:flex;align-items:center;justify-content:center;gap:10px;transition:background 0.2s
}
.login-btn:hover{background:#333}
.login-btn.guest{margin-top:10px;background:white;color:black;border:none}
.login-btn.guest:hover{background:#d9d9d9}
.login-btn:disabled{opacity:.5;cursor:wait}
.google-icon{font-weight:bold;color:#4285f4}
#error{color:#ff4e45!important;font-size:12px;margin-top:12px;overflow-wrap:anywhere}

/* HEADER */
header{
 height:56px;position:fixed;z-index:100;top:0;left:0;right:0;
 display:flex;align-items:center;justify-content:space-between;gap:16px;
 padding:0 16px;background:var(--bg)
}
.header-left,.header-right{display:flex;align-items:center;gap:12px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:white;font-size:18px}
.icon-btn:hover{background:var(--hover)}

/* SEARCH BAR */
.search{display:flex;width:min(46vw,640px);height:40px}
.search input{
 flex:1;min-width:0;padding:0 16px;border:1px solid #303030;
 border-radius:40px 0 0 40px;background:#121212;color:white;font-size:15px
}
.search input:focus{border-color:#1c62b9;outline:none}
.search button{
 width:64px;border:1px solid #303030;border-left:none;border-radius:0 40px 40px 0;
 background:#222;color:white;font-size:16px
}
.search button:hover{background:#2a2a2a}

.profile{
 width:32px;height:32px;border-radius:50%;
 background:#5b21b6;color:white;font-weight:bold;overflow:hidden;
 display:grid;place-items:center;font-size:14px;flex-shrink:0
}
.profile img{width:100%;height:100%;object-fit:cover}
.user-label{max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--text)}

/* SIDEBAR */
.sidebar{
 position:fixed;top:56px;bottom:0;left:0;width:240px;overflow-y:auto;
 padding:12px;background:var(--bg);z-index:90
}
.nav-item{
 display:flex;align-items:center;gap:24px;padding:10px 12px;
 border-radius:10px;cursor:pointer;font-size:14px;font-weight:400
}
.nav-item:hover{background:var(--hover)}
.nav-item.active{background:var(--hover);font-weight:600}
.nav-icon{width:24px;text-align:center;font-size:18px}
.nav-divider{border:0;border-top:1px solid #272727;margin:12px 0}
.nav-heading{padding:6px 12px;font-size:14px;font-weight:600;color:var(--muted)}

/* CATEGORY PILLS */
.categories{
 position:fixed;z-index:80;top:56px;left:240px;right:0;
 display:flex;gap:12px;overflow-x:auto;padding:12px 24px;
 background:var(--bg);scrollbar-width:none
}
.categories::-webkit-scrollbar{display:none}
.category{
 white-space:nowrap;border:none;border-radius:8px;padding:6px 12px;
 background:#272727;color:white;font-size:14px;font-weight:500;transition:0.2s
}
.category:hover{background:#3f3f3f}
.category.active{background:white;color:#0f0f0f}

/* MAIN CONTENT */
main{margin-left:240px;padding:116px 24px 40px}
.section-title{font-size:20px;margin:0 0 20px;font-weight:700}
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px 16px}
.video-card{min-width:0;cursor:pointer;display:flex;flex-direction:column}
.thumbnail{
 position:relative;aspect-ratio:16/9;overflow:hidden;
 border-radius:12px;background:#212121
}
.thumbnail img{width:100%;height:100%;object-fit:cover;transition:transform .2s}
.video-card:hover .thumbnail img{transform:scale(1.03)}
.duration{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,0.8);padding:3px 6px;border-radius:4px;font-size:12px;font-weight:500}
.video-info{display:flex;gap:12px;padding-top:12px}
.avatar{width:36px;height:36px;flex-shrink:0;display:grid;place-items:center;border-radius:50%;font-weight:bold;font-size:14px}
.video-title{font-size:14px;font-weight:600;line-height:1.4;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:12px;color:var(--muted);line-height:1.5}
.empty{grid-column:1/-1;text-align:center;padding:60px 10px;color:var(--muted)}

/* PLAYER MODAL */
.player-modal{
 display:none;position:fixed;inset:0;z-index:500;overflow-y:auto;
 background:#0f0f0f;padding:16px 24px
}
.player-modal.open{display:block}
.player-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.player-layout{
 max-width:1280px;margin:auto;
 display:grid;grid-template-columns:1fr 380px;gap:24px
}
.video-container{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.player-frame{width:100%;height:100%;border:0}

.player-title{font-size:18px;font-weight:700;line-height:1.4;margin:12px 0}
.player-actions{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.channel-info{display:flex;align-items:center;gap:12px}
.channel-name{font-weight:600;font-size:15px}
.action-btns{display:flex;gap:8px}
.action-btn{
 display:flex;align-items:center;gap:6px;padding:8px 14px;
 border-radius:18px;background:#272727;font-size:13px;font-weight:500
}
.action-btn:hover{background:#3f3f3f}
.player-description{padding:12px;border-radius:12px;background:#272727;font-size:13px;line-height:1.6;overflow-wrap:anywhere}

.related-item{display:flex;gap:10px;margin-bottom:12px;cursor:pointer}
.related-item img{width:140px;aspect-ratio:16/9;object-fit:cover;border-radius:8px}
.related-title{font-size:13px;font-weight:600;line-height:1.3;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* COLLAPSED & RESPONSIVE */
body.collapsed .sidebar{width:72px;padding:12px 4px}
body.collapsed .sidebar .nav-item{flex-direction:column;gap:6px;padding:14px 0;font-size:10px;text-align:center;justify-content:center}
body.collapsed .sidebar .nav-icon{font-size:20px}
body.collapsed .sidebar .nav-heading,body.collapsed .sidebar .nav-divider{display:none}
body.collapsed main{margin-left:72px}
body.collapsed .categories{left:72px}

@media(max-width:1024px){
 .player-layout{grid-template-columns:1fr}
}
@media(max-width:768px){
 .sidebar{display:none}
 .categories{left:0}
 main{margin-left:0;padding-top:110px}
 .search{width:auto;flex:1}
}
</style>
</head>

<body>

<!-- HALAMAN LOGIN -->
<section class="login-screen" id="loginScreen">
 <div class="login-box">
  <div class="brand"><span class="logo-icon">▶</span><span>movio</span></div>
  <h1>Welcome to Movio</h1>
  <p>Temukan video favoritmu, jelajahi hiburan, dan nikmati pengalaman menonton.</p>

  <button class="login-btn" id="googleBtn" onclick="googleLogin()">
   <span class="google-icon">G</span> Lanjutkan dengan Google
  </button>

  <button class="login-btn guest" onclick="guestLogin()">👤 Masuk sebagai Guest</button>
  <p id="error" role="alert"></p>
 </div>
</section>

<!-- HEADER -->
<header>
 <div class="header-left">
  <button class="icon-btn" onclick="toggleSidebar()" aria-label="Menu">☰</button>
  <a href="#" class="brand" onclick="showHome()"><span class="logo-icon">▶</span><span>movio</span></a>
 </div>

 <form class="search" id="searchForm">
  <input id="searchInput" type="search" placeholder="Cari video..." aria-label="Cari video">
  <button type="submit" aria-label="Cari">⌕</button>
 </form>

 <div class="header-right">
  <span class="user-label" id="userLabel">Guest</span>
  <button class="profile" id="profileBtn" onclick="showProfile()" aria-label="Profil">G</button>
 </div>
</header>

<!-- SIDEBAR -->
<aside class="sidebar">
 <div class="nav-item active" onclick="showHome(this)"><span class="nav-icon">⌂</span><span>Beranda</span></div>
 <div class="nav-item" onclick="showHistory(this)"><span class="nav-icon">◷</span><span>Histori</span></div>
 <hr class="nav-divider">
 <div class="nav-heading">Jelajahi</div>
 <div class="nav-item" onclick="filterCategory('Musik')"><span class="nav-icon">♫</span><span>Musik</span></div>
 <div class="nav-item" onclick="filterCategory('Film')"><span class="nav-icon">▣</span><span>Film</span></div>
 <div class="nav-item" onclick="filterCategory('Gaming')"><span class="nav-icon">🎮</span><span>Gaming</span></div>
 <hr class="nav-divider">
 <div class="nav-item" onclick="showProfile()"><span class="nav-icon">⚙</span><span>Akun & Setelan</span></div>
</aside>

<!-- KATEGORI -->
<nav class="categories" id="categories">
 <button class="category active" onclick="filterCategory('Semua',this)">Semua</button>
 <button class="category" onclick="filterCategory('Koleksi',this)">Video Saya</button>
 <button class="category" onclick="filterCategory('Musik',this)">Musik</button>
 <button class="category" onclick="filterCategory('Film',this)">Film</button>
 <button class="category" onclick="filterCategory('Gaming',this)">Gaming</button>
</nav>

<main>
 <div id="contentArea">
  <h2 class="section-title" id="pageTitle">Video pilihanmu</h2>
  <div class="video-grid" id="videoGrid"></div>
 </div>
</main>

<!-- PEMUTAR VIDEO -->
<section class="player-modal" id="playerModal">
 <div class="player-top">
  <div class="brand"><span class="logo-icon">▶</span><span>movio</span></div>
  <button class="icon-btn" onclick="closePlayer()" aria-label="Tutup">✕</button>
 </div>
 <div class="player-layout">
  <div>
   <div class="video-container" id="videoContainer">
    <iframe class="player-frame" id="videoFrame" src=""
     title="Pemutar video Movio"
     allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
     allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
   </div>

   <h2 class="player-title" id="playerTitle"></h2>
   <div class="player-actions">
    <div class="channel-info">
     <div class="avatar" id="playerAvatar" style="background:#e11d48">M</div>
     <div>
      <div class="channel-name" id="playerChannel"></div>
      <div class="meta">Koleksi Movio</div>
     </div>
    </div>
    <div class="action-btns">
     <button class="action-btn">👍 Suka</button>
     <button class="action-btn">↪ Bagikan</button>
    </div>
   </div>
   <div class="player-description" id="playerDescription"></div>
  </div>
  <div><h3 style="font-size:16px;margin:0 0 16px">Video lainnya</h3><div id="relatedVideos"></div></div>
 </div>
</section>

<!-- FIREBASE SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
"use strict";

/* FIREBASE CONFIG */
const firebaseConfig = {
 apiKey: "AIzaSyC2MfL9EFzVyxOyxemFV-_ywR01S2uEtAc",
 authDomain: "movio-6211e.firebaseapp.com",
 projectId: "movio-6211e",
 storageBucket: "movio-6211e.firebasestorage.app",
 messagingSenderId: "664861384384",
 appId: "1:664861384384:web:c1471091e9ac2870045725",
 measurementId: "G-30MECHH45V"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const googleProvider = new firebase.auth.GoogleAuthProvider();

/* VIDEO DATA */
const videos = [
 {
  id:"ifBXLaPp_uY",
  title:"Lagu Jawa Akustik Pengantar Tidur",
  channel:"Koleksi Musik",
  category:"Musik",
  duration:"Video",
  color:"#e11d48"
 },
 {
  id:"Xq0V_OvwV5o",
  title:"🌙 Lagu Jawa Akustik & Slow Pop Jawa Galau – Live Musik Pengantar Malam",
  channel:"Javanova",
  category:"Musik",
  duration:"LIVE",
  color:"#0284c7"
 },
 {
  id:"0BXVNT1yxqw",
  title:"DJ TIKTOK TERBARU 2026 || DJ ADAKAH KENYAMANAN DIHATIMU🎵DJ SALAH APA YANG TAK KUMAAFKAN🎵FULL ALBUM",
  channel:"Seven Fvnky",
  category:"Musik",
  duration:"FULL",
  color:"#e11d48"
 },
 {
  id:"ZsijEIkhAcc",
  title:"DJ TIKTOK TERBARU 2026🎵DJ HELIKOPTER TURUN KE PADANG🎵DJ ANAK KAMPUNG KERJAKU KERJA MOTONG 🔥",
  channel:"DJ AMOYCAN RMX",
  category:"Musik",
  duration:"FULL",
  color:"#7c3aed"
 },
 {
  id:"Mn4G8dr2Yw4",
  title:"Top Hits Spotify Indonesia 2026 | Top Spotify Indonesia 2026 | Lagu Hits Spotify 2026 | Lagu Terbaru",
  channel:"Aemj Gaming",
  category:"Musik",
  duration:"FULL",
  color:"#059669"
 }
];

let currentUser = null;
let isGuest = false;
let currentCategory = "Semua";
let currentQuery = "";
let watchHistory = [];

/* AUTHENTICATION */
async function googleLogin(){
 const button=document.getElementById("googleBtn");
 const error=document.getElementById("error");
 button.disabled=true;
 button.textContent="Menghubungkan...";
 error.textContent="";

 try{
  const result=await auth.signInWithPopup(googleProvider);
  enterGoogleUser(result.user);
 }catch(e){
  error.textContent="Gagal login Google. Silakan coba lagi.";
 }finally{
  button.disabled=false;
  button.innerHTML='<span class="google-icon">G</span> Lanjutkan dengan Google';
 }
}

function enterGoogleUser(user){
 isGuest=false;
 currentUser={name:user.displayName||"Pengguna Movio",email:user.email||"",photo:user.photoURL||""};
 document.getElementById("loginScreen").classList.add("hidden");
 document.getElementById("userLabel").textContent=currentUser.name;
 renderVideos();
}

function guestLogin(){
 isGuest=true;
 currentUser={name:"Guest",email:"",photo:""};
 document.getElementById("loginScreen").classList.add("hidden");
 document.getElementById("userLabel").textContent="Guest";
 renderVideos();
}

auth.onAuthStateChanged(user=>{
 if(user) enterGoogleUser(user);
 else if(!isGuest) document.getElementById("loginScreen").classList.remove("hidden");
});

function showProfile(){
 if(confirm("Keluar dari Movio?")){
  if(!isGuest) auth.signOut();
  currentUser=null;
  isGuest=false;
  document.getElementById("loginScreen").classList.remove("hidden");
 }
}

/* NAVIGATION */
function toggleSidebar(){
 document.body.classList.toggle("collapsed");
}

function showHome(el){
 currentCategory="Semua";
 currentQuery="";
 document.getElementById("searchInput").value="";
 document.getElementById("categories").classList.remove("hidden");
 document.getElementById("contentArea").innerHTML='<h2 class="section-title" id="pageTitle">Video pilihanmu</h2><div class="video-grid" id="videoGrid"></div>';
 renderVideos();
}

function filterCategory(category,el=null){
 currentCategory=category;
 currentQuery="";
 document.getElementById("searchInput").value="";
 document.getElementById("categories").classList.remove("hidden");
 document.getElementById("contentArea").innerHTML='<h2 class="section-title" id="pageTitle">'+category+'</h2><div class="video-grid" id="videoGrid"></div>';
 renderVideos();
}

/* RENDER VIDEOS */
function renderVideos(list=null){
 const grid=document.getElementById("videoGrid");
 if(!grid)return;

 const filtered=list||videos.filter(v=>{
  const categoryMatches=currentCategory==="Semua"||v.category===currentCategory;
  const searchable=(v.title+" "+v.channel).toLowerCase();
  return categoryMatches&&searchable.includes(currentQuery.toLowerCase());
 });

 if(!filtered.length){
  grid.innerHTML='<div class="empty"><h3>Video tidak ditemukan</h3></div>';
  return;
 }

 grid.innerHTML=filtered.map(v=>{
  const i=videos.indexOf(v);
  const thumb="https://img.youtube.com/vi/"+encodeURIComponent(v.id)+"/hqdefault.jpg";
  return `
   <article class="video-card" onclick="playVideo(${i})">
    <div class="thumbnail">
     <img src="${thumb}" alt="" loading="lazy">
     <span class="duration">${v.duration}</span>
    </div>
    <div class="video-info">
     <div class="avatar" style="background:${v.color}">${v.channel.charAt(0)}</div>
     <div>
      <div class="video-title">${v.title}</div>
      <div class="meta">${v.channel}</div>
     </div>
    </div>
   </article>`;
 }).join("");
}

/* VIDEO PLAYER */
function playVideo(index){
 const v=videos[index];
 if(!v)return;

 watchHistory=[v,...watchHistory.filter(x=>x.id!==v.id)];

 document.getElementById("videoFrame").src=
  "https://www.youtube-nocookie.com/embed/"+encodeURIComponent(v.id)+"?autoplay=1&rel=0";

 document.getElementById("playerTitle").textContent=v.title;
 document.getElementById("playerChannel").textContent=v.channel;
 document.getElementById("playerAvatar").textContent=v.channel.charAt(0);
 document.getElementById("playerAvatar").style.background=v.color;
 document.getElementById("playerDescription").textContent="Kategori: "+v.category+" • Diputar melalui pemutar Movio.";

 document.getElementById("relatedVideos").innerHTML=
  videos.filter(x=>x.id!==v.id).map(x=>`
   <div class="related-item" onclick="playVideo(${videos.indexOf(x)})">
    <img src="https://img.youtube.com/vi/${encodeURIComponent(x.id)}/mqdefault.jpg" alt="">
    <div>
     <div class="related-title">${x.title}</div>
     <div class="meta">${x.channel}</div>
    </div>
   </div>
  `).join("");

 document.getElementById("playerModal").classList.add("open");
 document.body.style.overflow="hidden";
}

function closePlayer(){
 document.getElementById("playerModal").classList.remove("open");
 document.getElementById("videoFrame").src="";
 document.body.style.overflow="";
}

/* HISTORY */
function showHistory(){
 document.getElementById("categories").classList.add("hidden");
 document.getElementById("contentArea").innerHTML='<h2 class="section-title">Histori tontonan</h2><div class="video-grid" id="videoGrid"></div>';
 renderVideos(watchHistory);
}

/* SEARCH */
document.getElementById("searchForm").addEventListener("submit",e=>{
 e.preventDefault();
 currentQuery=document.getElementById("searchInput").value.trim();
 filterCategory("Semua");
});

renderVideos();
</script>
</body>
</html>
