<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f0f0f">
<title>Movio - Watch Your Favorite Videos</title>

<style>
:root{
  --bg:#0f0f0f;
  --panel:#181818;
  --hover:#303030;
  --text:#f1f1f1;
  --muted:#aaa;
  --red:#ff3155;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
button:focus-visible,input:focus-visible{outline:2px solid #8ab4ff;outline-offset:2px}
.brand{display:flex;align-items:center;gap:9px;font-size:25px;font-weight:800;letter-spacing:-1px}
.logo{display:grid;place-items:center;width:36px;height:29px;border-radius:8px;background:var(--red);color:white;font-size:17px}
.muted,.meta{color:var(--muted)}

/* LOGIN */
.login-screen{
 position:fixed;inset:0;z-index:1000;display:flex;align-items:center;
 justify-content:center;padding:20px;overflow-y:auto;
 background:radial-gradient(ellipse at 10% 10%,#51213d,transparent 45%),
 radial-gradient(ellipse at 90% 90%,#20265b,transparent 45%),#0b0b0f
}
.login-box{
 width:100%;max-width:420px;padding:35px 28px;text-align:center;
 border:1px solid #ffffff20;border-radius:24px;background:#18181df5;
 box-shadow:0 25px 90px #0008
}
.login-box .brand{justify-content:center}
.login-box h1{margin:28px 0 10px;font-size:28px}
.login-box p{font-size:14px;line-height:1.7;color:var(--muted)}
.login-btn{
 width:100%;margin-top:14px;padding:14px;border:1px solid #444;
 border-radius:30px;background:#fff;color:#222;font-weight:bold
}
.login-btn:hover{filter:brightness(.92)}
.login-btn.guest{background:var(--red);border-color:var(--red);color:white}
.login-btn:disabled{opacity:.6;cursor:wait}
.google-icon{color:#4285f4;font-size:19px;margin-right:9px}
#error{color:#ff9999!important;overflow-wrap:anywhere}

/* HEADER */
header{
 height:64px;position:fixed;z-index:100;top:0;left:0;right:0;
 display:flex;align-items:center;justify-content:space-between;gap:18px;
 padding:0 22px;background:var(--bg)
}
.header-left,.header-right{display:flex;align-items:center;gap:12px}
.icon-btn{width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:white;font-size:21px}
.icon-btn:hover{background:var(--hover)}
.search{display:flex;width:min(48vw,600px);height:42px}
.search input{
 flex:1;min-width:0;padding:0 18px;border:1px solid #393939;
 border-radius:24px 0 0 24px;background:#121212;color:white
}
.search button{
 width:62px;border:1px solid #393939;border-radius:0 24px 24px 0;
 background:#272727;color:white;font-size:21px
}
.profile{
 width:36px;height:36px;border:0;border-radius:50%;
 background:#7439a8;color:white;font-weight:bold;overflow:hidden;flex-shrink:0
}
.profile img{width:100%;height:100%;object-fit:cover}
.user-label{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--muted)}

/* SIDEBAR */
.sidebar{
 position:fixed;top:64px;bottom:0;left:0;width:220px;overflow-y:auto;
 padding:12px;background:var(--bg);z-index:90
}
.nav-item{
 display:flex;align-items:center;gap:20px;padding:13px 14px;
 border-radius:10px;cursor:pointer;font-size:14px
}
.nav-item:hover,.nav-item.active{background:var(--hover)}
.nav-icon{width:23px;text-align:center;font-size:20px}
.nav-divider{border:0;border-top:1px solid #333;margin:14px 0}
.nav-heading{padding:10px 14px;font-weight:bold}

/* KATEGORI */
.categories{
 position:fixed;z-index:80;top:64px;left:220px;right:0;
 display:flex;gap:12px;overflow-x:auto;padding:14px 24px;
 background:var(--bg);scrollbar-width:none
}
.categories::-webkit-scrollbar{display:none}
.category{
 white-space:nowrap;border:0;border-radius:8px;padding:9px 15px;
 background:#272727;color:white;font-size:13px
}
.category.active{background:white;color:#111;font-weight:bold}
main{margin-left:220px;padding:125px 25px 40px}
.section-title{font-size:22px;margin:15px 0 22px}
.video-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px 17px}
.video-card{min-width:0;cursor:pointer}
.thumbnail{
 position:relative;aspect-ratio:16/9;overflow:hidden;
 border-radius:12px;background:#252525
}
.thumbnail img{width:100%;height:100%;object-fit:cover;transition:transform .2s}
.video-card:hover .thumbnail img{transform:scale(1.04)}
.duration{position:absolute;right:8px;bottom:8px;background:#000d;padding:4px 6px;border-radius:4px;font-size:11px}
.video-info{display:flex;gap:11px;padding-top:12px}
.avatar{width:36px;height:36px;flex-shrink:0;display:grid;place-items:center;border-radius:50%;font-weight:bold}
.video-title{font-size:14px;font-weight:bold;line-height:1.5;margin-bottom:6px}
.meta{font-size:12px;line-height:1.7}
.empty{grid-column:1/-1;text-align:center;padding:60px 10px;color:var(--muted)}

/* PLAYER */
.player-modal{
 display:none;position:fixed;inset:0;z-index:500;overflow-y:auto;
 background:#0f0f0f;padding:20px
}
.player-modal.open{display:block}
.player-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.player-layout{
 max-width:1250px;margin:auto;
 display:grid;grid-template-columns:minmax(0,2fr) minmax(230px,1fr);gap:24px
}
.player-frame{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000}
.player-title{font-size:21px;line-height:1.5}
.player-description{padding:16px;border-radius:12px;background:#242424;font-size:13px;line-height:1.8;overflow-wrap:anywhere}
.related-item{display:flex;gap:10px;margin-bottom:15px;cursor:pointer}
.related-item img{width:135px;aspect-ratio:16/9;object-fit:cover;border-radius:7px}
.related-title{font-size:12px;font-weight:bold;line-height:1.5}

body.collapsed .sidebar{width:75px}
body.collapsed .sidebar .nav-item{flex-direction:column;gap:6px;padding:12px 2px;font-size:10px;text-align:center}
body.collapsed .sidebar .nav-heading,body.collapsed .sidebar .nav-divider{display:none}
body.collapsed main{margin-left:75px}
body.collapsed .categories{left:75px}

@media(max-width:1050px){
 .video-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .player-layout{grid-template-columns:1fr}
}
@media(max-width:650px){
 header{height:58px;padding:0 8px;gap:5px}
 .header-left,.header-right{gap:4px}
 .brand{font-size:20px;gap:5px}
 .logo{width:30px;height:25px}
 .search{height:37px;flex:1;width:auto}
 .search input{width:30px;padding:0 9px}
 .search button{width:40px}
 .user-label{display:none}
 .sidebar{top:58px;width:65px;padding:5px}
 .sidebar .nav-item{flex-direction:column;gap:5px;padding:12px 1px;font-size:9px;text-align:center}
 .sidebar .nav-heading,.sidebar .nav-divider{display:none}
 .categories{top:58px;left:65px;padding:12px 10px}
 main{margin-left:65px;padding:115px 10px 30px}
 .video-grid{grid-template-columns:1fr;gap:25px}
 .player-modal{padding:10px}
 .player-title{font-size:17px}
 .login-box{padding:27px 20px}
}
</style>
</head>

<body>

<!-- HALAMAN LOGIN -->
<section class="login-screen" id="loginScreen">
 <div class="login-box">
  <div class="brand"><span class="logo">▶</span><span>movio</span></div>
  <h1>Welcome to Movio</h1>
  <p>Temukan video favoritmu, jelajahi hiburan, dan nikmati pengalaman menonton.</p>

  <button class="login-btn" id="googleBtn" onclick="googleLogin()">
   <span class="google-icon">G</span> Lanjutkan dengan Google
  </button>

  <button class="login-btn guest" onclick="guestLogin()">👤 Masuk sebagai Guest</button>
  <p id="error" role="alert"></p>
  <p>Mulai jelajahi video pilihanmu di Movio.</p>
 </div>
</section>

<!-- HEADER -->
<header>
 <div class="header-left">
  <button class="icon-btn" onclick="toggleSidebar()" aria-label="Menu">☰</button>
  <div class="brand"><span class="logo">▶</span><span>movio</span></div>
 </div>

 <form class="search" id="searchForm">
  <input id="searchInput" type="search" placeholder="Cari video..." aria-label="Cari video">
  <button type="submit" aria-label="Cari">⌕</button>
 </form>

 <div class="header-right">
  <span class="user-label" id="userLabel">Guest</span>
  <button class="profile" id="profileBtn" onclick="showProfile()" aria-label="Profil">G</button>
 </div>
</header>

<!-- SIDEBAR -->
<aside class="sidebar">
 <div class="nav-item active" onclick="showHome(this)"><span class="nav-icon">⌂</span><span>Beranda</span></div>
 <div class="nav-item" onclick="showHistory(this)"><span class="nav-icon">◷</span><span>Histori</span></div>
 <hr class="nav-divider">
 <div class="nav-heading">Jelajahi</div>
 <div class="nav-item" onclick="filterCategory('Musik')"><span class="nav-icon">♫</span><span>Musik</span></div>
 <div class="nav-item" onclick="filterCategory('Film')"><span class="nav-icon">▣</span><span>Film</span></div>
 <div class="nav-item" onclick="filterCategory('Gaming')"><span class="nav-icon">🎮</span><span>Gaming</span></div>
 <hr class="nav-divider">
 <div class="nav-item" onclick="showProfile()"><span class="nav-icon">⚙</span><span>Akun & Setelan</span></div>
</aside>

<!-- KATEGORI -->
<nav class="categories" id="categories">
 <button class="category active" onclick="filterCategory('Semua',this)">Semua</button>
 <button class="category" onclick="filterCategory('Koleksi',this)">Video Saya</button>
 <button class="category" onclick="filterCategory('Musik',this)">Musik</button>
 <button class="category" onclick="filterCategory('Film',this)">Film</button>
 <button class="category" onclick="filterCategory('Gaming',this)">Gaming</button>
</nav>

<main>
 <div id="contentArea">
  <h2 class="section-title" id="pageTitle">Video pilihanmu</h2>
  <div class="video-grid" id="videoGrid"></div>
 </div>
</main>

<!-- PEMUTAR VIDEO -->
<section class="player-modal" id="playerModal">
 <div class="player-top">
  <div class="brand"><span class="logo">▶</span><span>movio</span></div>
  <button class="icon-btn" onclick="closePlayer()" aria-label="Tutup">✕</button>
 </div>
 <div class="player-layout">
  <div>
   <iframe class="player-frame" id="videoFrame" src=""
    title="Pemutar video Movio"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
   <h2 class="player-title" id="playerTitle"></h2>
   <div class="player-description" id="playerDescription"></div>
  </div>
  <div><h3>Video lainnya</h3><div id="relatedVideos"></div></div>
 </div>
</section>

<!-- FIREBASE SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
"use strict";

/* =================================
    KONFIGURASI FIREBASE
================================= */
const firebaseConfig = {
 apiKey: "AIzaSyC2MfL9EFzVyxOyxemFV-_ywR01S2uEtAc",
 authDomain: "movio-6211e.firebaseapp.com",
 projectId: "movio-6211e",
 storageBucket: "movio-6211e.firebasestorage.app",
 messagingSenderId: "664861384384",
 appId: "1:664861384384:web:c1471091e9ac2870045725",
 measurementId: "G-30MECHH45V"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const googleProvider = new firebase.auth.GoogleAuthProvider();

/* =================================
    DAFTAR VIDEO (Video Movio 3 telah dihapus)
================================= */
const videos = [
 {
  id:"0BXVNT1yxqw",
  title:"Video Movio 1",
  channel:"Koleksi Movio",
  category:"Koleksi",
  duration:"Video",
  color:"#e11d48"
 },
 {
  id:"ZsijEIkhAcc",
  title:"Video Movio 2",
  channel:"Koleksi Movio",
  category:"Koleksi",
  duration:"Video",
  color:"#7c3aed"
 },
 {
  id:"Mn4G8dr2Yw4",
  title:"Video Movio 4",
  channel:"Koleksi Movio",
  category:"Koleksi",
  duration:"Video",
  color:"#059669"
 }
];

let currentUser = null;
let isGuest = false;
let currentCategory = "Semua";
let currentQuery = "";
let watchHistory = [];

/* =================================
    LOGIN GOOGLE
================================= */
async function googleLogin(){
 const button=document.getElementById("googleBtn");
 const error=document.getElementById("error");

 button.disabled=true;
 button.textContent="Menghubungkan ke Google...";
 error.textContent="";

 try{
  const result=await auth.signInWithPopup(googleProvider);
  enterGoogleUser(result.user);
 }catch(e){
  console.error("Google login:",e);

  if(e.code==="auth/popup-blocked"){
   try{
    await auth.signInWithRedirect(googleProvider);
    return;
   }catch(err){
    error.textContent="Popup diblokir. Izinkan popup di browser.";
   }
  }else if(e.code==="auth/unauthorized-domain"){
   error.textContent="Domain belum terdaftar di Firebase Authorized domains.";
  }else if(e.code==="auth/operation-not-allowed"){
   error.textContent="Aktifkan Google di Firebase Authentication.";
  }else if(e.code==="auth/popup-closed-by-user"){
   error.textContent="Login dibatalkan. Silakan coba kembali.";
  }else{
   error.textContent="Login gagal: "+(e.message||e.code||"Kesalahan tidak diketahui");
  }
 }finally{
  button.disabled=false;
  button.innerHTML='<span class="google-icon">G</span> Lanjutkan dengan Google';
 }
}

function enterGoogleUser(user){
 isGuest=false;
 currentUser={
  name:user.displayName||"Pengguna Movio",
  email:user.email||"",
  photo:user.photoURL||"",
  type:"google"
 };

 document.getElementById("loginScreen").classList.add("hidden");
 document.getElementById("userLabel").textContent=currentUser.name;

 const profile=document.getElementById("profileBtn");
 profile.replaceChildren();

 if(currentUser.photo){
  const img=document.createElement("img");
  img.src=currentUser.photo;
  img.alt="Foto profil";
  profile.appendChild(img);
 }else{
  profile.textContent=currentUser.name.charAt(0).toUpperCase();
 }
 renderVideos();
}

/* =================================
    LOGIN GUEST
================================= */
function guestLogin(){
 isGuest=true;
 currentUser={name:"Guest",email:"",photo:"",type:"guest"};

 document.getElementById("loginScreen").classList.add("hidden");
 document.getElementById("error").textContent="";
 document.getElementById("userLabel").textContent="Guest";

 const profile=document.getElementById("profileBtn");
 profile.replaceChildren();
 profile.textContent="G";

 showHome(document.querySelector(".sidebar .nav-item"));
}

/* =================================
    MEMULIHKAN LOGIN FIREBASE
================================= */
auth.getRedirectResult().then(result=>{
 if(result&&result.user)enterGoogleUser(result.user);
}).catch(e=>{
 console.error("Redirect login:",e);
 document.getElementById("error").textContent="Login redirect gagal. Coba lagi.";
});

auth.onAuthStateChanged(user=>{
 if(user){
  enterGoogleUser(user);
 }else if(!isGuest){
  currentUser=null;
  document.getElementById("loginScreen").classList.remove("hidden");
 }
});

/* =================================
    PROFIL DAN KELUAR
================================= */
async function showProfile(){
 if(!currentUser)return;

 const message="Akun: "+currentUser.name+
  (currentUser.email?"\nEmail: "+currentUser.email:"")+
  "\n\nKeluar dari Movio?";

 if(!confirm(message))return;

 try{
  if(!isGuest&&auth.currentUser)await auth.signOut();

  currentUser=null;
  isGuest=false;
  closePlayer();

  document.getElementById("loginScreen").classList.remove("hidden");
  document.getElementById("userLabel").textContent="Guest";

  const profile=document.getElementById("profileBtn");
  profile.replaceChildren();
  profile.textContent="G";
 }catch(e){
  alert("Gagal keluar: "+e.message);
 }
}

/* =================================
    NAVIGASI
================================= */
function toggleSidebar(){
 document.body.classList.toggle("collapsed");
}

function setActiveNav(el){
 document.querySelectorAll(".sidebar .nav-item").forEach(x=>x.classList.remove("active"));
 if(el)el.classList.add("active");
}

function setActiveCategory(el){
 document.querySelectorAll(".category").forEach(x=>x.classList.remove("active"));
 if(el)el.classList.add("active");
}

function showHome(el){
 currentCategory="Semua";
 currentQuery="";
 document.getElementById("searchInput").value="";
 document.getElementById("categories").classList.remove("hidden");

 document.getElementById("contentArea").innerHTML=
  '<h2 class="section-title" id="pageTitle">Video pilihanmu</h2>'+
  '<div class="video-grid" id="videoGrid"></div>';

 setActiveNav(el);
 setActiveCategory(document.querySelector(".category"));
 renderVideos();
}

function filterCategory(category,el=null){
 currentCategory=category;
 currentQuery="";
 document.getElementById("searchInput").value="";
 document.getElementById("categories").classList.remove("hidden");

 if(!el){
  el=[...document.querySelectorAll(".category")]
   .find(b=>b.textContent.trim()===(category==="Koleksi"?"Video Saya":category));
 }

 setActiveCategory(el);

 document.getElementById("contentArea").innerHTML=
  '<h2 class="section-title" id="pageTitle"></h2>'+
  '<div class="video-grid" id="videoGrid"></div>';

 document.getElementById("pageTitle").textContent=
  category==="Semua"?"Video pilihanmu":category==="Koleksi"?"Video Saya":category;

 renderVideos();
}

/* =================================
    PENCARIAN VIDEO
================================= */
document.getElementById("searchForm").addEventListener("submit",e=>{
 e.preventDefault();

 currentQuery=document.getElementById("searchInput").value.trim();
 currentCategory="Semua";
 setActiveCategory(document.querySelector(".category"));
 document.getElementById("categories").classList.remove("hidden");

 document.getElementById("contentArea").innerHTML=
  '<h2 class="section-title" id="pageTitle"></h2>'+
  '<div class="video-grid" id="videoGrid"></div>';

 document.getElementById("pageTitle").textContent=
  currentQuery?"Hasil pencarian: "+currentQuery:"Semua video";

 renderVideos();
});

document.getElementById("searchInput").addEventListener("input",e=>{
 if(!e.target.value.trim()){
  currentQuery="";
  renderVideos();
 }
});

function escapeHTML(s){
 return String(s).replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c]));
}

/* =================================
    RENDER KARTU VIDEO
================================= */
function renderVideos(list=null){
 const grid=document.getElementById("videoGrid");
 if(!grid)return;

 const filtered=list||videos.filter(v=>{
  const categoryMatches=
   currentCategory==="Semua"||v.category===currentCategory;

  const searchable=(v.title+" "+v.channel+" "+v.category).toLowerCase();

  return categoryMatches&&searchable.includes(currentQuery.toLowerCase());
 });

 if(!filtered.length){
  grid.innerHTML=
   '<div class="empty"><h3>Video tidak ditemukan</h3>'+
   '<p>Coba kata pencarian lain.</p></div>';
  return;
 }

 grid.innerHTML=filtered.map(v=>{
  const i=videos.indexOf(v);
  const thumb="https://img.youtube.com/vi/"+
   encodeURIComponent(v.id)+"/hqdefault.jpg";

  return `
   <article class="video-card" onclick="playVideo(${i})">
    <div class="thumbnail">
     <img src="${thumb}" alt="${escapeHTML(v.title)}" loading="lazy"
      onerror="this.style.opacity='.35'">
     <span class="duration">${escapeHTML(v.duration)}</span>
    </div>
    <div class="video-info">
     <div class="avatar" style="background:${v.color}">
      ${escapeHTML(v.channel.charAt(0))}
     </div>
     <div>
      <div class="video-title">${escapeHTML(v.title)}</div>
      <div class="meta">${escapeHTML(v.channel)}<br>
       Koleksi video pilihan
      </div>
     </div>
    </div>
   </article>`;
 }).join("");
}

/* =================================
    PEMUTAR VIDEO YOUTUBE
================================= */
function playVideo(index){
 const v=videos[index];
 if(!v)return;

 watchHistory=[v,...watchHistory.filter(x=>x.id!==v.id)];

 document.getElementById("videoFrame").src=
  "https://www.youtube-nocookie.com/embed/"+
  encodeURIComponent(v.id)+"?autoplay=1&rel=0";

 document.getElementById("playerTitle").textContent=v.title;

 document.getElementById("playerDescription").innerHTML=
  "<strong>"+escapeHTML(v.channel)+"</strong>"+
  "<br>Kategori: Koleksi Movio"+
  "<br><br>Video diputar melalui pemutar Movio.";

 document.getElementById("relatedVideos").innerHTML=
  videos.filter(x=>x.id!==v.id).map(x=>`
   <div class="related-item" onclick="playVideo(${videos.indexOf(x)})">
    <img src="https://img.youtube.com/vi/${encodeURIComponent(x.id)}/mqdefault.jpg"
     alt="" loading="lazy">
    <div class="related-title">${escapeHTML(x.title)}
     <div class="meta">${escapeHTML(x.channel)}</div>
    </div>
   </div>
  `).join("");

 document.getElementById("playerModal").classList.add("open");
 document.body.style.overflow="hidden";
}

function closePlayer(){
 document.getElementById("playerModal").classList.remove("open");
 document.getElementById("videoFrame").src="";
 document.body.style.overflow="";
}

/* =================================
    HISTORI TONTONAN
================================= */
function showHistory(el){
 setActiveNav(el);
 document.getElementById("categories").classList.add("hidden");

 document.getElementById("contentArea").innerHTML=
  '<h2 class="section-title">Histori tontonan</h2>'+
  '<div class="video-grid" id="videoGrid"></div>';

 if(!watchHistory.length){
  document.getElementById("videoGrid").innerHTML=
   '<div class="empty"><h3>Belum ada histori</h3>'+
   '<p>Video yang kamu tonton akan muncul di sini selama sesi ini.</p></div>';
 }else{
  renderVideos(watchHistory);
}
}

/* TAMPILAN AWAL */
renderVideos();
</script>
</body>
</html>
